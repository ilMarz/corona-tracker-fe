
 <ng-container *ngIf="showContent">
    <mat-toolbar class="toolbar">
        <span>News</span>
    </mat-toolbar>
    <a href="/home"> home </a>
    <div class="container container-flex">
        <div class="left-news">
            <div class="news-content">
                <ng-container *ngFor="let data of dataNews">                
                    <mat-expansion-panel hideToggle>
                        <mat-expansion-panel-header>
                        <mat-panel-title>
                            {{data.title}}
                        </mat-panel-title>
                        <mat-panel-description>
                            <p>{{data.source.$.url}}</p>
                            <p>{{data.pubDate | date:'medium'}}</p>
                        </mat-panel-description>
                        </mat-expansion-panel-header>
                        <p>{{data.description}}</p>
                    </mat-expansion-panel>
                </ng-container>
            </div>
            
        </div>
        <div class="right-news">
            <div class="news-content">
                <mat-card class="info-card world-data-value-card">
                    <mat-card-header>
                        <mat-card-title>prova card </mat-card-title>
                    </mat-card-header>
                    <mat-card-content class="info-card-value">
                        prova content card
                    </mat-card-content>
                    <mat-card-footer class="last-update">
                        footer card
                    </mat-card-footer>
                </mat-card>
            </div>
            
        </div>
     </div>

 </ng-container>
