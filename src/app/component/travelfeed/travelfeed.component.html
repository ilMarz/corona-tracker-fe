
 <ng-container *ngIf="showContent">
    <mat-toolbar class="toolbar news-toolbar">
        <div class="news-title">
            <span>News</span>
            <span class="lastDataRetrieve">{{'feed.lastDataRetrieve' | translate}}: {{lastDataRetrieve}}</span>
        </div>
    </mat-toolbar>
    <mat-toolbar class="toolbar-radio news-toolbar-radio">
        <div class="toolbar-radio-news-content">
            <div>
                <mat-icon>home</mat-icon> <a href="/home"> stats </a>
            </div>
            <div class="search-text">
                <mat-form-field class="search-form-field">
                    <mat-label>Search...</mat-label>
                    <input matInput type="text" [(ngModel)]="newsSearchInput">                      
                </mat-form-field>
            </div>
            <div class="search-select">
                <img [src]="getLanguageFlag(selectedNewsLang)" alt="image">
                <mat-select matNativeControl [(ngModel)]="selectedNewsLang" name="car" (selectionChange)="doSomething($event)" placeholder="en">
                    <mat-option *ngFor="let lang of newsLang" [value]="lang.value">
                    {{lang.key}}
                    </mat-option>
                </mat-select>  
            </div>
        </div>
    </mat-toolbar>
    <div class="container container-flex">
        <div>
            <div class="news-content">
                <ng-container *ngFor="let data of dataNews | filter:newsSearchInput">                
                    <mat-expansion-panel expanded="false">
                        <mat-expansion-panel-header [collapsedHeight]="'10%'">
                        <mat-panel-title>
                            <div class="news-title">{{data.title}}</div>
                        </mat-panel-title>
                        <mat-panel-description>
                            <p class="news-date"> <mat-icon>date_range</mat-icon>{{data.pubDate | date:'shortDate'}} - {{data.pubDate | date:'shortTime'}}</p>
                        </mat-panel-description>
                        </mat-expansion-panel-header>
                        <div>
                            <div>{{'feed.open' | translate}}</div>
                            <div [innerHTML]=data.description></div>
                            <p class="news-author"><mat-icon>person</mat-icon>{{data.source.$.url}}</p>
                        </div>
                    </mat-expansion-panel>
                </ng-container>
            </div>
            
        </div>

     </div>

 </ng-container>
