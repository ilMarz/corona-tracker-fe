
 <ng-container *ngIf="showContent">
    <mat-toolbar class="toolbar">
        <span>News</span>
    </mat-toolbar>
    <a href="/home"> home </a>
    <div class="container container-flex">
        <div class="left-news">
            <div class="news-content">
                <mat-expansion-panel hideToggle>
                    <mat-expansion-panel-header>
                    <mat-panel-title>
                        This is the expansion title
                    </mat-panel-title>
                    <mat-panel-description>
                        This is a summary of the content
                    </mat-panel-description>
                    </mat-expansion-panel-header>
                    <p>This is the primary content of the panel.</p>
                </mat-expansion-panel>
            </div>
            
        </div>
        <div class="right-news">
            <div class="news-content">
                <mat-card class="info-card world-data-value-card">
                    <mat-card-header>
                        <mat-card-title>prova card </mat-card-title>
                    </mat-card-header>
                    <mat-card-content class="info-card-value">
                        prova content card
                    </mat-card-content>
                    <mat-card-footer class="last-update">
                        footer card
                    </mat-card-footer>
                </mat-card>
            </div>
            
        </div>
     </div>

 </ng-container>
