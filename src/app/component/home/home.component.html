
<mat-spinner *ngIf="!infoData || infoData.length == 0"></mat-spinner>
<mat-toolbar class="toolbar">
    <ng-container *ngFor="let item of worldStats | keyvalue">
        <mat-card class="data-value" *ngIf="isAllowedColumn(item.key)">
            <mat-card-header>
                <mat-card-subtitle>
                    {{item.key}}
                </mat-card-subtitle>
            </mat-card-header>
            <mat-card-content class="data-value-content">
                {{item.value}}
            </mat-card-content>
        </mat-card>

    </ng-container>
</mat-toolbar>
<div class="container">
    <mat-toolbar class="toolbar-radio">
        <mat-radio-group [(ngModel)]="orderType">
            <mat-radio-button class="example-margin" value="az">A-Z</mat-radio-button>
            <mat-radio-button class="example-margin" value="case">Total Cases</mat-radio-button>
            <mat-radio-button class="example-margin" value="death">Total Deaths</mat-radio-button>
          </mat-radio-group>
    </mat-toolbar>
    

    <mat-card class="info-card" *ngFor="let info of infoData | infoPipe:orderType">
        <mat-card-header>
            <mat-card-title>{{info.countryCode}} - {{info.country}} </mat-card-title>
            <mat-card-subtitle class="font-color-white">{{info.continent}}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content class="info-card-value">
            <ng-container *ngFor="let item of info | keyvalue">
                <mat-card class="data-value" *ngIf="isAllowedColumn(item.key)">
                    <mat-card-header>
                        <mat-card-title>
                            {{item.key}}
                        </mat-card-title>
                    </mat-card-header>
                    <mat-card-content class="data-value-content">
                        {{item.value}}
                    </mat-card-content>
                </mat-card>

            </ng-container>


            <!-- >mat-table *ngIf="info.length > 0" [dataSource]="info" class="mat-elevation-z8">
                <ng-container [matColumnDef]="column" *ngFor="let column of columns">
                    <th mat-header-cell *matHeaderCellDef> {{column}} </th>
                    <td mat-cell *matCellDef="let element"> {{element[column]}} </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="columns"></tr>
                <tr mat-row *matRowDef="let row; columns: columns;"></tr>
            </mat-table-->
        </mat-card-content>
        <mat-card-footer>
            Last updated: {{info.updated | date}}
        </mat-card-footer>
    </mat-card>
</div>
